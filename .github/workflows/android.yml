name: Android CI

# 构建一律走仓库自带的 wrapper：版本由 gradle-wrapper.properties 固定，
# 不依赖 runner 上预装的 gradle 是哪个版本，也不依赖 setup-gradle 是否把
# `gradle` 塞进 PATH。setup-gradle 只用来做依赖缓存。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 新建仓库的 GITHUB_TOKEN 默认只读，创建 Release 需要显式写权限；
# 不给的话 release job 会在最后一步报 403 Resource not accessible by integration。
permissions:
  contents: write

jobs:
  verify:
    name: 单元测试与 debug 构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本由 wrapper 固定，这个 action 只负责依赖缓存与构建扫描配置；
      # 不再传 gradle-version，避免 runner 上的 gradle 与 wrapper 打架。
      - name: 准备 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK
        # 不用 android-actions/setup-android：它会去装早已从仓库下线的 "tools" 包，
        # 新版 sdkmanager 直接报 Failed to find package 'tools' 并退出。
        # runner 镜像自带 SDK，这里只确保工程需要的 platform 与 build-tools 在。
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "找不到 Android SDK（ANDROID_SDK_ROOT/ANDROID_HOME 都为空）" >&2
            exit 1
          fi
          echo "SDK=$SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            echo "sdkmanager=$SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "没有 sdkmanager，依赖镜像自带的 platform 与 build-tools"
          fi
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

      - name: 构建环境自检
        # 先跑一次 --version：wrapper 下载/解压失败、JAVA_HOME 不对，都在这里暴露，
        # 而不是等到几分钟后某个任务报一串看不懂的错。
        run: |
          java -version
          ./gradlew --version

      - name: 单元测试
        run: ./gradlew test --console=plain --stacktrace

      - name: 构建 debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: 构建 release APK 并发布
    # 只在推送 v* 标签时执行；签名材料从仓库 Secrets 恢复，绝不入库。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本由 wrapper 固定，这个 action 只负责依赖缓存与构建扫描配置；
      # 不再传 gradle-version，避免 runner 上的 gradle 与 wrapper 打架。
      - name: 准备 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK
        # 不用 android-actions/setup-android：它会去装早已从仓库下线的 "tools" 包，
        # 新版 sdkmanager 直接报 Failed to find package 'tools' 并退出。
        # runner 镜像自带 SDK，这里只确保工程需要的 platform 与 build-tools 在。
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "找不到 Android SDK（ANDROID_SDK_ROOT/ANDROID_HOME 都为空）" >&2
            exit 1
          fi
          echo "SDK=$SDK"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            echo "sdkmanager=$SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "没有 sdkmanager，依赖镜像自带的 platform 与 build-tools"
          fi
          ls "$SDK/platforms"
          ls "$SDK/build-tools"

      - name: 恢复签名材料
        # 用 env 传密钥，避免 secret 被拼进脚本正文；也避免 heredoc 缩进污染 properties。
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: 预检签名材料
        # Gradle 报 "Keystore was tampered with, or password was incorrect" 时，分不清是
        # secret 传坏了还是口令填错了。先让 keytool 明确报一次，省一轮排查。
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          ls -l keystore/release.jks
          keytool -list -keystore keystore/release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "签名材料可读：$KEY_ALIAS"

      - name: 构建 release APK
        run: ./gradlew assembleRelease --console=plain

      - name: 校验打包结果
        # 包名、versionName、签名证书（必须不是 debug 证书）、两种语言的资源是否被
        # isShrinkResources 裁掉、图标资源、Application 是否注册、体积。
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/verify-release.ps1 -ExpectedVersion $version

      - name: 生成 SHA-256 校验文件
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true